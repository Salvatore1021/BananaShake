services:
  postgres:
    image: postgres:16-alpine
    container_name: apix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apix
      POSTGRES_USER: apix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apix_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - apix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apix -d apix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apix_pgdata:
